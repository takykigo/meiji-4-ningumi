        <h1>立山登山：富山県の伝統行事</h1>
        <p>富山県の多くの小学校では、毎年7月末に6年生が立山（雄山 3,003m）に登ります。これは全国的にも非常に珍しい、郷土の歴史と自然を学ぶ大切なイベントです。</p>

        <h2>なぜ立山に登るのか？</h2>
        <ul>
            <li><strong>歴史：</strong> 江戸時代の「立山講」という成人儀礼がルーツ。</li>
            <li><strong>体験：</strong> 3,000m級の頂上でお祓いを受け、達成感を味わう。</li>
        </ul>

        <h2>他県との比較</h2>
        <table>
            <tr><th>地域</th><th>対象の山</th><th>内容</th></tr>
            <tr><td>富山県</td><td>立山</td><td>6年生のほぼ全員。非常に高い実施率。</td></tr>
            <tr><td>長野県</td><td>燕岳など</td><td>「学校登山」として中学生も登る。</td></tr>
            <tr><td>山梨・静岡</td><td>富士山</td><td>麓の学校が中心。日本一を目指す。</td></tr>
